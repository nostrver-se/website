image: php:8.5-alpine

variables:
  DRUPAL_PROJECTROOT: "/var/www/vhosts/sebastix.nl/nostrver.se"
  URL: "https://nostrver.se"
  SSH_LOGIN: "ssh -T sebastix@nostrver.se"
  SSH_USER: "sebastix"
  SSH_HOST: "nostrver.se"

workflow:
  rules:
    # Pipelines do not run when branchname starts with ^aupdt_
    - if: $CI_COMMIT_BRANCH =~ /^aupdt_/
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"'

stages:
  - build
  - deploy

before_script:
  - 'which ssh-agent || ( apk add --update openssh )'
  - apk add --update bash
  - eval $(ssh-agent -s)
  - echo "$SSH_PRIVATE_KEY_PROD" | ssh-add -
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  # Install rsync
  - apk add rsync
  # Install curl
  - apk add curl
  # Install git
  - apk add git
  # Install patch
  - apk add patch
  # Install composer
  - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/bin --filename=composer
  - alias composer='php /usr/bin/composer'
  - composer --version
  # install php extensions
  # - see https://github.com/mlocati/docker-php-extension-installer
  - curl -sSLf -o /usr/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions
  - chmod +x /usr/bin/install-php-extensions
  - install-php-extensions gd gmp xml

build:drupal:
  stage: build
  script:
    - composer install --no-dev --prefer-dist --optimize-autoloader
    - composer patches-repatch
  artifacts:
    expire_in: 4 hours
    paths:
      - web
      - vendor

deploy:prd:
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"'
      when: manual
  stage: deploy
  dependencies:
    - build:drupal
  environment:
    name: prd
    url: $URL
  script:
    - rsync -avz -e composer.json $SSH_USER@$SSH_HOST:$DRUPAL_PROJECTROOT
    - rsync -avz -e composer.lock $SSH_USER@$SSH_HOST:$DRUPAL_PROJECTROOT
    - rsync -avz --delete --exclude-from='gitlab-ci/rsync-excludes.txt' -e ssh ./config $SSH_USER@$SSH_HOST:$DRUPAL_PROJECTROOT
    - rsync -avz --delete --exclude-from='gitlab-ci/rsync-excludes.txt' -e ssh ./vendor $SSH_USER@$SSH_HOST:$DRUPAL_PROJECTROOT
    - rsync -avz --delete --exclude-from='gitlab-ci/rsync-excludes.txt' -e ssh ./web $SSH_USER@$SSH_HOST:$DRUPAL_PROJECTROOT
    # - $SSH_LOGIN "chown -R sebastix:www-data $DRUPAL_PROJECTROOT"
    - $SSH_LOGIN "$DRUPAL_PROJECTROOT/vendor/bin/drush updatedb -y --no-cache-clear"
    - $SSH_LOGIN "$DRUPAL_PROJECTROOT/vendor/bin/drush cache-rebuild -y"
    - $SSH_LOGIN "$DRUPAL_PROJECTROOT/vendor/bin/drush config-import -y"
    - $SSH_LOGIN "$DRUPAL_PROJECTROOT/vendor/bin/drush ckeditor5_markdown_editor:install"
    # When module locale is enabled:
    #- $SSH_LOGIN "cd $DRUPAL_PROJECTROOT && vendor/bin/drush locale:check"
    #- $SSH_LOGIN "cd $DRUPAL_PROJECTROOT && vendor/bin/drush locale:update"
    - $SSH_LOGIN "$DRUPAL_PROJECTROOT/vendor/bin/drush core-cron"
    - $SSH_LOGIN "$DRUPAL_PROJECTROOT/vendor/bin/drush cache-rebuild -y"
    - $SSH_LOGIN "$DRUPAL_PROJECTROOT/vendor/bin/drush deploy:hook"
    - echo "Deployment ready, check $URL"
